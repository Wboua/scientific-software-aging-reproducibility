name: Reproducibility checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/validate_repository.py
      - run: python scripts/verify_evidence_hashes.py
      - run: python analysis/scripts/run_analysis.py
      - run: python analysis/scripts/robustness_analysis.py
